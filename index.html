<title>Drop Shot x Palio Coffee</title>
<style>
:root{
  --green:#0B4723; --pine:#1C4036; --gold:#B78F32; --cream:#F3E8A9; --lime:#D6DF24; --teal:#1C8D7C;
  --gold-2:#C3922E; --beige-2:#DCD49C; --gold-lt:#D6B45F;
  --paper:#FCF8E6; --cream-soft:#F7EFC9; --gold-ink:#7A5C17; --teal-ink:#14695C;
  --ink:#1C4036; --ink-soft:rgba(28,64,54,.78); --rule:rgba(11,71,35,.16);
  --f-display:"Superclarendon","Rockwell","Clarendon","Bookman Old Style",Georgia,serif;
  --f-body:"Baskerville","Baskerville Old Face","Libre Baskerville",Georgia,"Times New Roman",serif;
  --f-label:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s8:64px;
}
*{box-sizing:border-box;}
@media screen{html{scroll-padding-top:150px;scroll-padding-bottom:104px;}}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.55;}
img{max-width:100%;height:auto;}
.skip{position:absolute;left:-9999px;top:0;background:var(--green);color:var(--cream);padding:var(--s1) var(--s2);font-family:var(--f-label);z-index:10;}
.skip:focus{left:var(--s2);top:var(--s2);}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* top bar and tab strip */
.dk-top{position:sticky;top:0;z-index:5;background:var(--pine);box-shadow:0 1px 0 rgba(183,143,50,.55),0 6px 18px rgba(12,40,30,.18);}
.dk-brand{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);max-width:1240px;margin:0 auto;padding:12px var(--s3) 6px;}
.dk-brand img{display:block;width:132px;height:auto;}
.dk-count{font-family:var(--f-label);font-size:13px;letter-spacing:.14em;color:rgba(243,232,169,.82);font-variant-numeric:tabular-nums;}
.dk-count b{color:var(--lime);font-weight:600;}
.dk-bar{position:relative;max-width:1240px;margin:0 auto;}
.dk-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 var(--s2);}
.dk-tabs::-webkit-scrollbar{display:none;}
.dk-tabs::after{content:"";flex:0 0 calc(15% + 8px);max-width:80px;}
.dk-tab{flex:none;display:flex;align-items:baseline;gap:7px;min-height:44px;padding:10px 12px 12px;border:0;border-bottom:3px solid transparent;background:none;color:rgba(243,232,169,.74);font-family:var(--f-label);font-size:14px;font-weight:500;letter-spacing:.01em;cursor:pointer;white-space:nowrap;}
.dk-tab .n{font-size:12px;font-weight:600;letter-spacing:.1em;color:rgba(243,232,169,.78);font-variant-numeric:tabular-nums;}
.dk-tab:hover{color:var(--cream);}
.dk-tab[aria-selected="true"]{color:var(--cream);border-bottom-color:var(--gold);}
.dk-tab[aria-selected="true"] .n{color:var(--lime);}
.dk-tab:focus-visible{outline:2px solid var(--lime);outline-offset:-4px;border-radius:4px;}
.dk-bar::after{content:"";position:absolute;top:0;right:0;bottom:3px;width:15%;max-width:72px;pointer-events:none;background:linear-gradient(90deg,rgba(28,64,54,0),var(--pine));}

/* slide card */
main{max-width:1240px;margin:0 auto;padding:var(--s4) var(--s3) var(--s6);}
.dk-panel:focus{outline:none;}
.slide{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 210px);background:var(--paper);border:1px solid var(--beige-2);border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px -22px rgba(12,40,30,.35);padding:var(--s6) var(--s8) var(--s4);}
.slide::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--gold) 0 88px,var(--lime) 88px 100px,var(--teal) 100px 112px,var(--green) 112px);}
.imprint{position:absolute;right:-28px;top:28px;width:210px;height:240px;color:var(--gold);opacity:.11;pointer-events:none;}
.sl-head{position:relative;max-width:46em;}
.kicker{display:flex;align-items:center;gap:12px;margin:0 0 var(--s2);font-family:var(--f-label);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);}
.kicker .kn{font-variant-numeric:tabular-nums;color:var(--green);}
.kicker .kr{display:inline-block;width:36px;height:2px;background:var(--gold);}
.slide h1,.slide h2{margin:0 0 var(--s3);font-family:var(--f-display);font-weight:700;color:var(--green);line-height:1.12;letter-spacing:-.005em;font-size:clamp(30px,3.6vw,46px);}
.lead{margin:0 0 var(--s4);font-size:clamp(19px,1.7vw,23px);line-height:1.5;color:var(--ink);max-width:40em;}
.sl-body{position:relative;display:flex;flex-direction:column;gap:var(--s4);flex:1;}
.sl-body p{margin:0;max-width:44em;}
.sl-body strong{font-weight:700;color:var(--green);}
.sl-body mark,.lead mark{background:linear-gradient(transparent 62%,rgba(214,223,36,.55) 62%);color:inherit;padding:0 2px;}
.subhead{margin:var(--s1) 0 0;font-family:var(--f-display);font-weight:700;font-size:25px;color:var(--green);line-height:1.2;}
.sl-foot{position:relative;display:flex;align-items:center;gap:var(--s3);margin-top:var(--s5);padding-top:var(--s2);border-top:1px solid var(--rule);font-family:var(--f-label);font-size:12px;letter-spacing:.08em;color:var(--ink-soft);}
.sl-foot img{width:104px;height:auto;display:block;}
.sl-foot .ft{flex:1;}
.sl-foot .pg{font-variant-numeric:tabular-nums;letter-spacing:.14em;color:var(--green);font-weight:600;}

/* blocks */
.ptext{font-size:19px;}
.list{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:48em;}
.list li{position:relative;padding-left:28px;}
.list li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;background:var(--lime);border:1.5px solid var(--green);transform:rotate(45deg);}
.list.grid{grid-template-columns:1fr 1fr;gap:var(--s2) var(--s3);max-width:none;}
.list.grid li{background:#fff;border:1px solid var(--beige-2);border-radius:4px;padding:var(--s2) var(--s3) var(--s2) 46px;font-size:17px;}
.list.grid li::before{left:20px;top:calc(var(--s2) + .55em);}
.list.featured{grid-template-columns:1fr 1fr;gap:var(--s2) var(--s3);max-width:none;}
.list.featured li{grid-column:1 / -1;}
.list.featured li.feat{grid-column:auto;background:var(--green);color:var(--cream);border-radius:4px;padding:var(--s3) var(--s3) var(--s3) 50px;font-family:var(--f-display);font-size:20px;line-height:1.3;box-shadow:inset 0 3px 0 var(--gold);}
.list.featured li.feat strong{color:var(--cream);}
.list.featured li.feat::before{left:22px;top:calc(var(--s3) + .45em);border-color:var(--cream);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s2);}
.cards.n5{grid-template-columns:repeat(6,1fr);}
.cards.n5 .card{grid-column:span 2;}
.cards.n5 .card:nth-child(n+4){grid-column:span 3;}
.card{background:var(--cream-soft);border:1px solid var(--beige-2);border-top:3px solid var(--gold);border-radius:4px;padding:var(--s2) var(--s3) var(--s3);}
.card h3,.col h3,.step h3,.band h3{margin:0 0 var(--s1);font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;color:var(--green);}
.card p,.step p{font-size:17px;color:var(--ink);}
.band{border-left:4px solid var(--teal);background:rgba(28,141,124,.07);border-radius:0 4px 4px 0;padding:var(--s2) var(--s3);max-width:56em;}
.band h3{font-size:18px;font-family:var(--f-label);font-weight:700;font-variant-caps:all-small-caps;letter-spacing:.12em;color:var(--teal-ink);font-size:20px;margin-bottom:10px;}
.band .list{gap:10px;}
.intent{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:.82em;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--teal-ink) !important;border:1.5px solid var(--teal);border-radius:3px;padding:0 6px;line-height:1.5;margin-right:2px;}
.callout .intent{color:var(--lime) !important;border-color:var(--lime);}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.pcard{background:#fff;border:1px solid var(--beige-2);border-radius:4px;padding:var(--s3);border-top:3px solid var(--teal);}
.pcard.lead-card{border-top-color:var(--gold);}
.pcard p{font-size:19px;}
.pcard .pname{display:block;font-family:var(--f-display);font-size:24px;line-height:1.2;margin-bottom:6px;color:var(--green);}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.col{border:1px solid var(--beige-2);border-radius:4px;background:#fff;overflow:hidden;}
.col h3{margin:0;padding:14px var(--s3);background:var(--cream-soft);border-bottom:1px solid var(--beige-2);}
.col.lead-col h3{background:var(--green);color:var(--cream);border-bottom:3px solid var(--gold);}
.col .list{padding:var(--s3);gap:12px;}
.callout{position:relative;background:var(--pine);color:var(--cream);border-radius:4px;padding:var(--s3) var(--s4);max-width:56em;box-shadow:inset 4px 0 0 var(--gold);}
.callout h3{margin:0 0 6px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--gold-2);}
.callout p{color:var(--cream);font-size:20px;line-height:1.5;}
.callout strong{color:var(--lime);}
.options{position:relative;border:1.5px dashed var(--gold);border-radius:6px;padding:var(--s2) var(--s3) var(--s3);background:repeating-linear-gradient(135deg,rgba(243,232,169,.42) 0 10px,rgba(243,232,169,.22) 10px 20px);max-width:58em;}
.options .ol{margin:0 0 12px;font-family:var(--f-label);font-size:15px;font-weight:700;font-variant-caps:all-small-caps;letter-spacing:.14em;color:var(--gold-ink);}
.options ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;}
.options li{display:flex;gap:14px;align-items:baseline;font-family:var(--f-display);font-size:20px;line-height:1.35;color:var(--green);}
.options li strong{color:var(--green);font-weight:900;}
.badge{flex:none;display:inline-block;font-family:var(--f-label);font-size:13px;font-weight:700;font-variant-caps:all-small-caps;letter-spacing:.1em;line-height:1;color:var(--pine);background:var(--lime);border:1px dashed var(--pine);border-radius:999px;padding:5px 10px 6px;white-space:nowrap;position:relative;top:-2px;}
.ledger{background:var(--pine);border-radius:6px;padding:var(--s3) var(--s4);box-shadow:inset 0 3px 0 var(--gold);max-width:58em;color:var(--cream);}
.ledger .lhead{margin:0 0 var(--s3);font-family:var(--f-display);font-weight:900;font-size:clamp(24px,2.6vw,34px);line-height:1.15;color:var(--cream);}
.ledger .num{color:var(--lime);white-space:nowrap;}
.lbody{display:flex;flex-direction:column;}
.lop{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--lime);text-align:center;}
.lamt{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--gold-lt);white-space:nowrap;text-align:right;font-variant-numeric:lining-nums tabular-nums;}
.lgroup{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s2);margin:0 0 var(--s1) 40px;padding:14px 18px;border:1.5px solid rgba(214,223,36,.55);border-radius:10px;background:rgba(243,232,169,.06);}
.leq{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;}
.lterm{display:flex;flex-direction:column;gap:4px;min-width:0;padding:10px 14px;border:1px solid rgba(243,232,169,.22);border-radius:6px;max-width:19em;}
.lterm .ll{font-size:16px;line-height:1.3;color:rgba(243,232,169,.92);}
.lterm .lv{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--cream);font-variant-numeric:lining-nums;}
.lterm.mult{border-style:dashed;}
.lterm.mult .ll{font-size:17px;color:var(--cream);}
.lres{display:flex;align-items:center;gap:12px;justify-content:flex-end;}
.lres .lamt{font-size:26px;}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:baseline;gap:var(--s2);padding:12px 18px 12px 0;border-bottom:1px solid rgba(243,232,169,.16);}
.lrow .ll{font-size:19px;color:rgba(243,232,169,.92);}
.lrow.total{border-bottom:0;border-top:2px solid var(--gold);margin-top:4px;padding-top:14px;}
.lrow.total .ll{font-family:var(--f-label);font-weight:700;font-size:18px;color:var(--cream);}
.lrow.total .lamt{font-weight:900;font-size:32px;color:var(--lime);}
.pass{background:#fff;border:1px solid var(--beige-2);border-radius:6px;padding:var(--s3) var(--s4);box-shadow:inset 0 4px 0 var(--gold);max-width:58em;}
.pass .phead{margin:0 0 4px;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,2.8vw,36px);color:var(--green);}
.pass .psub{margin:0 0 var(--s3);font-size:20px;}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);}
.price{display:flex;flex-direction:column;gap:8px;border:1px solid var(--beige-2);border-radius:4px;padding:var(--s2) var(--s3);background:var(--cream-soft);}
.price .pl{font-family:var(--f-label);font-size:15px;color:var(--ink);}
.price .pv{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,3.2vw,42px);line-height:1;color:var(--green);font-variant-numeric:lining-nums;}
.price.main{background:var(--pine);border-color:var(--pine);box-shadow:inset 0 3px 0 var(--lime);}
.price.main .pl{color:rgba(243,232,169,.92);}
.price.main .pv,.price.main .pv strong{color:var(--lime);}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:start;}
.half{display:flex;flex-direction:column;gap:var(--s3);}
.slide .half .hh{margin:0;font-size:clamp(28px,3vw,40px);}
.half.open{position:relative;background:#FAF2CF;border:1.5px dashed var(--teal);border-radius:6px;padding:var(--s3);}
.colon{font-size:0;line-height:0;}
.duo{max-width:none;background:#fff;}
.duo table{table-layout:fixed;font-size:18px;}
.duo th{font-family:var(--f-display);font-variant-caps:normal;letter-spacing:0;font-size:22px;font-weight:700;padding:14px var(--s3);background:var(--cream-soft);color:var(--green);border-bottom:3px solid var(--teal);}
.duo th.lead{background:var(--green);color:var(--cream);border-bottom-color:var(--gold);}
.duo td{height:auto;padding:12px var(--s3) 12px 46px;position:relative;vertical-align:top;line-height:1.4;}
.duo td::before{content:"";position:absolute;left:20px;top:calc(12px + .55em);width:9px;height:9px;background:var(--lime);border:1.5px solid var(--green);transform:rotate(45deg);}
.duo td.empty::before{display:none;}
.duo td.a{border-right:1px solid var(--beige-2);}
.duo tr:nth-child(even) td{background:rgba(243,232,169,.22);}
.tablewrap{overflow-x:auto;border:1px solid var(--beige-2);border-radius:4px;background:#fff;max-width:56em;}
.tablewrap:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
table{border-collapse:collapse;width:100%;font-size:17px;}
th{background:var(--green);color:var(--cream);text-align:left;font-family:var(--f-label);font-size:16px;font-weight:600;font-variant-caps:all-small-caps;letter-spacing:.1em;padding:12px var(--s2);border-bottom:3px solid var(--gold);}
td{padding:14px var(--s2);border-top:1px solid var(--beige-2);height:56px;vertical-align:top;}
tr:nth-child(even) td{background:rgba(243,232,169,.22);}
.tl{max-width:60em;}
.tl-head{display:grid;grid-template-columns:minmax(170px,300px) 1fr;gap:var(--s3);padding:0 0 8px 40px;font-family:var(--f-label);font-size:15px;font-weight:700;font-variant-caps:all-small-caps;letter-spacing:.14em;color:var(--gold-ink);border-bottom:2px solid var(--gold);}
.timeline{list-style:none;margin:0;padding:0;position:relative;}
.timeline::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--teal),rgba(28,141,124,.25));}
.timeline li{position:relative;display:grid;grid-template-columns:minmax(170px,300px) 1fr;gap:4px var(--s3);padding:11px 0 11px 40px;border-bottom:1px solid var(--rule);}
.timeline li:last-child{border-bottom:0;}
.timeline li::before{content:"";position:absolute;left:3px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:3px solid var(--teal);}
.timeline li.major::before{background:var(--gold);border-color:var(--green);}
.timeline li.major .w{color:var(--green);}
.timeline li.opt{background:repeating-linear-gradient(135deg,rgba(214,223,36,.14) 0 10px,rgba(214,223,36,.05) 10px 20px);border:1.5px dashed var(--gold);border-radius:4px;margin-bottom:6px;}
.timeline li.opt::before{border-style:dashed;}
.timeline li.opt .w,.timeline li.opt .x{color:var(--ink-soft);}
.timeline .w{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--green);line-height:1.35;}
.timeline .w .badge{margin-right:6px;}
.timeline .x{font-size:18px;line-height:1.45;}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3);counter-reset:st;}
.step{position:relative;padding:var(--s3);padding-top:72px;background:#fff;border:1px solid var(--beige-2);border-radius:4px;counter-increment:st;}
.step::before{content:counter(st);position:absolute;left:var(--s3);top:var(--s3);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--green);color:var(--cream);font-family:var(--f-display);font-weight:700;font-size:17px;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--gold);}
.signoff{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--green);padding-top:var(--s2);border-top:2px solid var(--gold);display:inline-block;align-self:flex-start;}
.sl-body .signoff strong{color:var(--green);}
.meta{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--f-label);font-size:16px;letter-spacing:.02em;}
.slide.untitled .sl-head .kicker{margin-bottom:var(--s3);}


/* cover line, name line, highlighted first line */
.cv-tag{margin:0;font-family:var(--f-display);font-size:clamp(20px,2vw,26px);line-height:1.35;max-width:30em;}
.slide.cover .cv-tag strong{color:var(--cream);font-weight:700;}
.nameline{max-width:58em;}
.nl-name{margin:0 0 6px;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,2.6vw,34px);line-height:1.15;color:var(--green);}
.nl-tag{font-size:clamp(18px,1.6vw,21px);line-height:1.45;color:var(--ink);}
.duo td.hl{font-weight:700;color:var(--green);}

/* review-mode:begin */
/* review notes, the draft only */
.rn{position:relative;margin-top:var(--s3);background:#FAF2CF;border:1.5px dashed var(--teal);border-radius:6px;padding:var(--s3);}
.rn + .rn{margin-top:var(--s2);}
.rn-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px var(--s2);}
.rn-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--green);}
.rn-sub{font-family:var(--f-label);font-size:13px;color:var(--ink-soft);}
.rn-chip{font-family:var(--f-label);font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;}
.rn-chip:empty{display:none;}
.rn-chip.saving{border:1.5px solid var(--teal);color:var(--teal-ink);}
.rn-chip.saved{background:var(--green);color:var(--cream);}
.rn-chip.unsaved{border:1.5px solid var(--gold-ink);color:var(--gold-ink);}
.rn-stat{margin:8px 0 0;min-height:1.2em;font-family:var(--f-label);font-size:14px;font-weight:600;color:var(--ink);}
.rn-stat:empty{display:none;}
.rn-retry{margin-left:10px;min-height:32px;padding:4px 14px;border:1px solid var(--green);border-radius:999px;background:var(--cream);color:var(--green);font-family:var(--f-label);font-size:13px;font-weight:600;cursor:pointer;}
.rn-ed{margin-top:12px;}
.rn .plan-rte-wrap{border:1px solid var(--beige-2);border-radius:8px;overflow:hidden;background:#fff;}
.rn-hint{margin:8px 0 0;font-family:var(--f-label);font-size:13px;color:var(--ink-soft);}
.rn .plan-rte-wrap{border:1px solid var(--beige-2);border-radius:8px;overflow:hidden;background:#fff;}
  .rn .rv-toolbar{display:flex;flex-wrap:wrap;gap:4px 0;padding:6px;border-bottom:1px solid rgba(12,71,35,.18);background:rgba(243,232,169,.22);}
  .rn .rv-tool{appearance:none;font:inherit;font-size:13px;font-weight:600;min-width:36px;min-height:36px;padding:0 6px;border-radius:6px;border:1px solid transparent;background:transparent;color:#0C4723;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;}
  .rn .rv-tool:hover{background:#FFFFFF;border-color:rgba(12,71,35,.18);}
  .rn .rv-tool b,.rn .rv-tool i,.rn .rv-tool u,.rn .rv-tool s{font-size:15px;}
  .rn select.rv-tool{padding:0 8px;background:#FFFFFF;border-color:rgba(12,71,35,.18);}
  .rn .rv-tool input[type="color"]{width:22px;height:22px;padding:0;border:1px solid rgba(12,71,35,.18);border-radius:4px;background:none;cursor:pointer;}
  .rn .rv-group{display:inline-flex;flex-wrap:nowrap;align-items:center;gap:2px;padding:0 6px;border-left:1px solid rgba(12,71,35,.18);}
  .rn .rv-group:first-child{border-left:0;padding-left:0;}
  .rn .plan-rte blockquote,.rn .plan-rte-pv blockquote{margin:0 0 0 32px;padding:0;border:0;color:inherit;}
  .rn .plan-rte p,.rn .plan-rte-pv p{margin:0 0 6px;}
  .rn .plan-rte{border:0;border-radius:0;padding:10px 12px;overflow:auto;white-space:normal;outline:none;min-height:110px;background:#fff;font-size:14px;line-height:20px;}
  .rn .plan-rte:empty:before{content:attr(data-ph);color:var(--muted);}
  .rn .plan-rte code,.rn .plan-rte-pv code{font-family:var(--mono);background:var(--paper);padding:0 3px;border-radius:3px;}
  .rn .plan-rte h3,.rn .plan-rte-pv h3{margin:8px 0 4px;font-size:17px;}
  .rn .plan-rte ul,.rn .plan-rte ol{margin:4px 0;padding-left:22px;}
  .rn .plan-rte-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.rn .plan-rte{min-height:180px;font-family:var(--f-body);font-size:17px;line-height:1.5;color:var(--ink);}
.rn .plan-rte:empty:before{content:none;}
@media (max-width:820px){.rn .rv-tool{min-height:44px;min-width:44px;}.rn .rv-toolbar{flex-wrap:nowrap;overflow-x:auto;}.rn .rv-group{flex:none;}}
.rn .plan-rte{min-height:140px;font-family:var(--f-body);font-size:17px;line-height:1.5;color:var(--ink);}
